<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leo & Ester - Nosso Casamento</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: #f8f6f3;
            color: #2c2c2c;
        }

        header {
            text-align: center;
            padding: 90px 20px 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 50px;
        }

        .subtitulo {
            font-size: 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b89b72;
        }

        #contador-lateral {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            text-align: center;
        }

            #contador-lateral span {
                font-size: 32px;
                font-weight: bold;
                color: #b89b72;
            }

        section {
            max-width: 900px;
            margin: 100px auto;
            padding: 0 20px;
            text-align: center;
        }

        .info-box {
            background: white;
            padding: 50px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
        }

        input {
            padding: 14px;
            width: 80%;
            margin: 12px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        button {
            background: #b89b72;
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        iframe {
            width: 100%;
            height: 380px;
            border-radius: 18px;
            border: none;
        }
    </style>
</head>

<body>

    <div id="contador-lateral">
        Faltam<br>
        <span id="dias"></span><br>
        dias
    </div>

    <header>
        <h1>Leo & [Nome]</h1>
        <div class="subtitulo">16 de Maio de 2026 • 16h</div>
    </header>

    <section>
        <div class="info-box">
            <h2>Cerimônia</h2>
            <p><strong>Igreja Evangélica Avivamento Bíblico</strong></p>
            <p>R. Ricardo Ninelli, 223</p>
            <p>São Carlos/SP</p>
        </div>
    </section>

    <section>
        <div class="info-box">
            <h2>Confirme sua Presença</h2>
            <input type="text" id="nome" placeholder="Seu nome completo">
            <input type="number" id="acompanhantes" placeholder="Número de acompanhantes">
            <button onclick="confirmarPresenca()">Confirmar</button>
        </div>
    </section>

    <section>
        <div class="info-box">
            <h2>Contribuição via Pix</h2>
            <input type="number" id="valorPix" placeholder="Digite o valor (R$)">
            <div id="qrcode"></div>
            <p>Chave Pix:</p>
            <strong>45289314865</strong>
        </div>
    </section>

    <section>
        <div class="info-box">
            <h2>Nossa Playlist 🎵</h2>
            <iframe src="https://open.spotify.com/embed/playlist/59o1J4N0X3Eovrv9rREuQQ?utm_source=generator"
                    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
            </iframe>
        </div>
    </section>

    <section>
        <h2>Localização</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3652.950418720515!2d-47.898198!3d-22.060432!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94b877bc17876a71%3A0x42e4b84d0c0fdb16!2sIgreja%20Evang%C3%A9lica%20Avivamento%20Bibl%C3%ADco%20em%20S%C3%A3o%20Carlos!5e0!3m2!1spt-BR!2sbr">
        </iframe>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // 🔥 CONFIG DO SEU FIREBASE
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "chadecozinhaesterleonardo.firebaseapp.com",
            databaseURL: "https://chadecozinhaesterleonardo-default-rtdb.firebaseio.com",
            projectId: "chadecozinhaesterleonardo",
            storageBucket: "chadecozinhaesterleonardo.appspot.com",
            messagingSenderId: "SEU_MESSAGING_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.confirmarPresenca = function () {
            const nome = document.getElementById("nome").value;
            const acompanhantes = document.getElementById("acompanhantes").value;

            if (nome === "") {
                alert("Digite seu nome");
                return;
            }

            const confirmacoesRef = ref(database, 'confirmacoesPresenca');

            push(confirmacoesRef, {
                nome: nome,
                acompanhantes: acompanhantes,
                data: new Date().toISOString()
            });

            alert("Presença confirmada 💛");
        }

        // CONTADOR
        const dataCasamento = new Date("May 16, 2026 16:00:00").getTime();
        const agora = new Date().getTime();
        const diff = dataCasamento - agora;
        const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
        document.getElementById("dias").innerText = dias;

    </script>

    <script>
        // QR CODE PIX
        document.getElementById("valorPix").addEventListener("change", function () {
            const chave = "SUA_CHAVE_PIX_AQUI";
            const texto = `PIX Leo & [Nome] - R$${this.value} - ${chave}`;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: texto, width: 200, height: 200 });
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ester & Leo - Nosso Casamento</title>

    <!-- FAVICON 🍃 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f8f6f3, #ece7df);
            color: #2c2c2c;
        }

        header {
            text-align: center;
            padding: 100px 20px 60px;
            animation: fadeIn 1.5s ease;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            margin: 0;
        }

        .subtitulo {
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #b89b72;
            margin-top: 10px;
        }

        #contador-lateral {
            position: fixed;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            text-align: center;
        }

            #contador-lateral span {
                font-size: 36px;
                font-weight: bold;
                color: #b89b72;
            }

        section {
            max-width: 900px;
            margin: 120px auto;
            padding: 0 20px;
            text-align: center;
        }

        .info-box {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(12px);
            padding: 60px;
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.07);
            transition: transform 0.4s ease;
        }

            .info-box:hover {
                transform: translateY(-8px);
            }

        input {
            padding: 16px;
            width: 80%;
            margin: 15px 0;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        button {
            background: linear-gradient(135deg, #b89b72, #a88a62);
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

            button:hover {
                transform: scale(1.05);
                box-shadow: 0 10px 25px rgba(184,155,114,0.4);
            }

        iframe {
            width: 100%;
            height: 380px;
            border-radius: 20px;
            border: none;
        }

        #qrcode {
            margin-top: 20px;
        }

        @media(max-width:768px) {
            #contador-lateral {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                margin: 30px auto;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div id="contador-lateral">
        Faltam<br>
        <span id="dias"></span><br>
        dias
    </div>

    <header>
        <h1>Ester & Leo</h1>
        <div class="subtitulo">16 de Maio de 2026 • 16h</div>
    </header>

    <section>
        <div class="info-box">
            <h2>Confirme sua Presença</h2>
            <input type="text" id="nome" placeholder="Seu nome completo">
            <input type="number" id="acompanhantes" placeholder="Número de acompanhantes">
            <button onclick="confirmarPresenca()">Confirmar</button>
        </div>
    </section>

    <section>
        <div class="info-box">
            <h2>Contribuição via Pix 🍃</h2>
            <input type="number" id="valorPix" placeholder="Digite o valor (R$)">
            <div id="qrcode"></div>
            <p>Chave Pix:</p>
            <strong>45289314865</strong>
        </div>
    </section>

    <section>
        <div class="info-box">
            <h2>Nossa Playlist 🎵</h2>
            <iframe src="https://open.spotify.com/embed/playlist/59o1J4N0X3Eovrv9rREuQQ"></iframe>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "chadecozinhaesterleonardo.firebaseapp.com",
            databaseURL: "https://chadecozinhaesterleonardo-default-rtdb.firebaseio.com",
            projectId: "chadecozinhaesterleonardo",
            storageBucket: "chadecozinhaesterleonardo.appspot.com",
            messagingSenderId: "SEU_MESSAGING_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        window.confirmarPresenca = function () {
            const nome = document.getElementById("nome").value.trim();
            const acompanhantes = document.getElementById("acompanhantes").value || 0;

            if (nome === "") {
                alert("Digite seu nome");
                return;
            }

            push(ref(database, 'confirmacoesPresenca'), {
                nome,
                acompanhantes: Number(acompanhantes),
                data: new Date().toISOString()
            });

            alert("Presença confirmada 💛");

            document.getElementById("nome").value = "";
            document.getElementById("acompanhantes").value = "";
        }

        function atualizarContador() {
            const dataCasamento = new Date("May 16, 2026 16:00:00").getTime();
            const agora = new Date().getTime();
            const diff = dataCasamento - agora;
            const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("dias").innerText = dias > 0 ? dias : 0;
        }

        atualizarContador();
        setInterval(atualizarContador, 60000);

    </script>

    <script>
        document.getElementById("valorPix").addEventListener("change", function () {
            const chave = "45289314865"; // 🔥 SUA CHAVE REAL
            const valor = this.value;

            if (!valor) return;

            const texto = `Pagamento Pix - Ester & Leo - R$${valor} - ${chave}`;

            document.getElementById("qrcode").innerHTML = "";

            new QRCode(document.getElementById("qrcode"), {
                text: texto,
                width: 220,
                height: 220
            });
        });
    </script>

</body>
</html>

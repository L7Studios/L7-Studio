<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ester & Leo - Nosso Casamento</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: 'Montserrat',sans-serif;
            background: linear-gradient(180deg,#f5efe6,#e8dfd2);
            color: #2c2c2c;
            overflow-x: hidden;
        }

        /* FUNDO ANIMADO */
        .leaf {
            position: fixed;
            top: -50px;
            font-size: 24px;
            animation: fall linear infinite;
            opacity: .4;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        header {
            text-align: center;
            padding: 100px 20px 60px;
        }

        h1 {
            font-family: 'Playfair Display',serif;
            font-size: clamp(36px,8vw,64px);
            margin: 0;
        }

        .subtitulo {
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #b89b72;
            margin-top: 15px;
            font-size: clamp(14px,3vw,18px);
        }

        section {
            max-width: 1000px;
            margin: 100px auto;
            padding: 0 20px;
        }

        .info-box {
            background: white;
            padding: clamp(30px,6vw,70px);
            border-radius: 30px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.06);
            text-align: center;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s ease;
        }

            .info-box.show {
                opacity: 1;
                transform: translateY(0);
            }

        h2 {
            font-family: 'Playfair Display',serif;
            font-size: clamp(22px,5vw,34px);
            margin-bottom: 25px;
        }

        input {
            padding: 16px;
            width: 100%;
            max-width: 400px;
            margin: 12px 0;
            border-radius: 14px;
            border: 1px solid #ddd;
            font-size: 16px;
        }

        button {
            background: #b89b72;
            color: white;
            border: none;
            padding: 16px 40px;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
            transition: .3s;
        }

            button:hover {
                background: #a88a62;
                transform: scale(1.05);
            }

        iframe {
            width: 100%;
            height: 350px;
            border: none;
            border-radius: 20px;
        }

        #contador {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,.1);
            text-align: center;
        }

            #contador span {
                font-size: 28px;
                font-weight: bold;
                color: #b89b72;
            }

        @media(max-width:768px) {
            section {
                margin: 70px auto;
            }

            #contador {
                position: relative;
                margin: 30px auto;
                right: auto;
                bottom: auto;
            }
        }
    </style>
</head>

<body>

    <div id="contador">
        Faltam<br>
        <span id="dias"></span><br>
        dias
    </div>

    <header>
        <h1>Ester & Leo</h1>
        <div class="subtitulo">16 de Maio de 2026 • 16h</div>
    </header>

    <section>
        <div class="info-box">
            <h2>Cerimônia</h2>
            <p><strong>Igreja Evangélica Avivamento Bíblico</strong></p>
            <p>R. Ricardo Ninelli, 223</p>
            <p>São Carlos/SP</p>
        </div>
    </section>

    <section>
        <div class="info-box">
            <h2>Confirme sua Presença</h2>
            <input type="text" id="nome" placeholder="Seu nome completo">
            <input type="number" id="acompanhantes" placeholder="Número de acompanhantes">
            <button onclick="confirmarPresenca()">Confirmar</button>
        </div>
    </section>

    <section>
        <div class="info-box">
            <h2>Contribuição via Pix 🍃</h2>
            <input type="number" id="valorPix" placeholder="Digite o valor (R$)">
            <div id="qrcode"></div>
            <p>Chave Pix:</p>
            <strong>45289314865</strong>
        </div>
    </section>

    <section>
        <div class="info-box">
            <h2>Nossa Playlist 🎵</h2>
            <iframe src="https://open.spotify.com/embed/playlist/59o1J4N0X3Eovrv9rREuQQ"></iframe>
        </div>
    </section>

    <section>
        <div class="info-box">
            <h2>Localização</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3652.950418720515!2d-47.898198!3d-22.060432!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94b877bc17876a71%3A0x42e4b84d0c0fdb16!2sIgreja%20Evang%C3%A9lica%20Avivamento%20Bibl%C3%ADco%20em%20S%C3%A3o%20Carlos!5e0!3m2!1spt-BR!2sbr"></iframe>
        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>

        // ANIMAÇÃO AO ROLAR
        const boxes = document.querySelectorAll(".info-box");
        window.addEventListener("scroll", () => {
            boxes.forEach(box => {
                const top = box.getBoundingClientRect().top;
                if (top < window.innerHeight - 100) {
                    box.classList.add("show");
                }
            });
        });

        // FOLHAS ANIMADAS
        for (let i = 0; i < 10; i++) {
            let leaf = document.createElement("div");
            leaf.classList.add("leaf");
            leaf.innerHTML = "🍃";
            leaf.style.left = Math.random() * 100 + "vw";
            leaf.style.animationDuration = (5 + Math.random() * 5) + "s";
            document.body.appendChild(leaf);
        }

        // CONTADOR
        function atualizarContador() {
            const data = new Date("May 16, 2026 16:00:00").getTime();
            const agora = new Date().getTime();
            const diff = data - agora;
            const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("dias").innerText = dias > 0 ? dias : 0;
        }
        atualizarContador();
        setInterval(atualizarContador, 60000);

        // QR PIX
        document.getElementById("valorPix").addEventListener("change", function () {
            const chave = "45289314865";
            const valor = this.value;
            if (!valor) return;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: `Pagamento Pix - Ester & Leo - R$${valor} - ${chave}`,
                width: 220,
                height: 220
            });
        });

    </script>

</body>
</html>

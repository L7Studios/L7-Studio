<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ester & Leo — 16.05.2026</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg: #f7f5f2;
            --text: #1f1f1f;
            --accent: #b89b72;
            --line: #e5e0d8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter',sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 0 20px;
        }

        header {
            padding: 120px 0 80px;
            text-align: center;
        }

        h1 {
            font-family: 'Cormorant Garamond',serif;
            font-size: clamp(40px,8vw,70px);
            font-weight: 600;
            letter-spacing: 1px;
        }

        .date {
            margin-top: 15px;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent);
        }

        .divider {
            width: 60px;
            height: 1px;
            background: var(--accent);
            margin: 40px auto;
        }

        section {
            padding: 90px 0;
            border-top: 1px solid var(--line);
        }

        h2 {
            font-family: 'Cormorant Garamond',serif;
            font-size: clamp(28px,5vw,36px);
            margin-bottom: 25px;
        }

        .info p {
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            max-width: 400px;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid var(--line);
            background: white;
            font-size: 15px;
        }

        button {
            margin-top: 15px;
            padding: 14px 35px;
            background: var(--accent);
            color: white;
            border: none;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: .3s;
        }

            button:hover {
                opacity: .85;
            }

        iframe {
            width: 100%;
            height: 380px;
            border: none;
            margin-top: 30px;
        }

        #contador {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: white;
            padding: 18px 22px;
            border: 1px solid var(--line);
            font-size: 13px;
            text-align: center;
        }

            #contador span {
                display: block;
                font-size: 22px;
                color: var(--accent);
                font-weight: 500;
            }

        @media(max-width:768px) {
            section {
                padding: 60px 0;
            }

            #contador {
                position: relative;
                margin: 40px auto;
                right: auto;
                bottom: auto;
                width: 140px;
            }
        }
    </style>
</head>

<body>

    <div id="contador">
        Faltam
        <span id="dias"></span>
        dias
    </div>

    <header class="container">
        <h1>Ester & Leo</h1>
        <div class="date">16 de Maio de 2026 — 16h</div>
        <div class="divider"></div>
    </header>

    <section class="container">
        <h2>Cerimônia</h2>
        <div class="info">
            <p><strong>Igreja Evangélica Avivamento Bíblico</strong></p>
            <p>R. Ricardo Ninelli, 223</p>
            <p>São Carlos/SP</p>
        </div>
    </section>

    <section class="container">
        <h2>Confirme sua presença</h2>
        <input type="text" id="nome" placeholder="Seu nome completo">
        <input type="number" id="acompanhantes" placeholder="Número de acompanhantes">
        <button onclick="confirmarPresenca()">Confirmar presença</button>
    </section>

    <section class="container">
        <h2>Contribuição via Pix</h2>
        <input type="number" id="valorPix" placeholder="Digite o valor (R$)">
        <div id="qrcode"></div>
        <p style="margin-top:15px;">Chave Pix:</p>
        <strong>45289314865</strong>
    </section>

    <section class="container">
        <h2>Nossa playlist</h2>
        <iframe src="https://open.spotify.com/embed/playlist/59o1J4N0X3Eovrv9rREuQQ"></iframe>
    </section>

    <section class="container">
        <h2>Localização</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3652.950418720515!2d-47.898198!3d-22.060432!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94b877bc17876a71%3A0x42e4b84d0c0fdb16!2sIgreja%20Evang%C3%A9lica%20Avivamento%20Bibl%C3%ADco%20em%20S%C3%A3o%20Carlos!5e0!3m2!1spt-BR!2sbr"></iframe>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>

        // CONTADOR
        function atualizarContador() {
            const data = new Date("May 16, 2026 16:00:00").getTime();
            const agora = new Date().getTime();
            const diff = data - agora;
            const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("dias").innerText = dias > 0 ? dias : 0;
        }
        atualizarContador();
        setInterval(atualizarContador, 60000);

        // QR PIX
        document.getElementById("valorPix").addEventListener("change", function () {
            const chave = "45289314865";
            const valor = this.value;
            if (!valor) return;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: `Pagamento Pix - Ester & Leo - R$${valor} - ${chave}`,
                width: 200,
                height: 200
            });
        });

    </script>

</body>
</html>

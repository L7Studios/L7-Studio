<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ester & Leo — 16.05.2026</title>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root {
            --bg: #f4f2ef;
            --card: #ffffff;
            --text: #1c1c1c;
            --accent: #b89b72;
            --muted: #777;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter',sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 0 20px;
        }

        header {
            padding: 140px 20px 100px;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display',serif;
            font-size: clamp(42px,8vw,72px);
            font-weight: 600;
            letter-spacing: .5px;
        }

        .date {
            margin-top: 15px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 13px;
            color: var(--accent);
        }

        section {
            padding: 100px 0;
        }

        .card {
            background: var(--card);
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.05);
            margin-bottom: 40px;
        }

        h2 {
            font-family: 'Playfair Display',serif;
            font-size: clamp(26px,5vw,36px);
            margin-bottom: 30px;
        }

        p {
            margin-bottom: 8px;
            color: var(--muted);
        }

        input {
            width: 100%;
            max-width: 420px;
            padding: 16px;
            margin: 12px 0;
            border: 1px solid #e5e5e5;
            background: #fafafa;
            font-size: 15px;
            border-radius: 8px;
        }

        button {
            margin-top: 15px;
            padding: 14px 40px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: .3s;
        }

            button:hover {
                opacity: .85;
            }

        iframe {
            width: 100%;
            height: 380px;
            border: none;
            border-radius: 16px;
            margin-top: 30px;
        }

        /* CONTADOR FLUTUANTE */
        #contador {
            position: fixed;
            right: 30px;
            bottom: 30px;
            background: var(--accent);
            color: white;
            padding: 18px 28px;
            border-radius: 50px;
            box-shadow: 0 15px 40px rgba(0,0,0,.15);
            font-size: 14px;
            letter-spacing: 1px;
            text-align: center;
        }

            #contador span {
                display: block;
                font-size: 20px;
                font-weight: 500;
                margin-top: 4px;
            }

        /* RESPONSIVO */
        @media(max-width:768px) {

            header {
                padding: 100px 20px 70px;
            }

            .card {
                padding: 35px;
            }

            #contador {
                right: 20px;
                bottom: 20px;
                padding: 14px 22px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

    <div id="contador">
        Faltam
        <span id="dias"></span>
        dias
    </div>

    <header>
        <div class="container">
            <h1>Ester & Leo</h1>
            <div class="date">16 de Maio de 2026 — 16h</div>
        </div>
    </header>

    <section>
        <div class="container">

            <div class="card">
                <h2>Cerimônia</h2>
                <p><strong>Igreja Evangélica Avivamento Bíblico</strong></p>
                <p>R. Ricardo Ninelli, 223</p>
                <p>São Carlos/SP</p>
            </div>

            <div class="card">
                <h2>Confirme sua presença</h2>
                <input type="text" id="nome" placeholder="Seu nome completo">
                <input type="number" id="acompanhantes" placeholder="Número de acompanhantes">
                <button onclick="confirmarPresenca()">Confirmar presença</button>
            </div>

            <div class="card">
                <h2>Contribuição via Pix</h2>
                <input type="number" id="valorPix" placeholder="Digite o valor (R$)">
                <div id="qrcode"></div>
                <p style="margin-top:20px;">Chave Pix:</p>
                <strong>45289314865</strong>
            </div>

            <div class="card">
                <h2>Nossa playlist</h2>
                <iframe src="https://open.spotify.com/embed/playlist/59o1J4N0X3Eovrv9rREuQQ"></iframe>
            </div>

            <div class="card">
                <h2>Localização</h2>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3652.950418720515!2d-47.898198!3d-22.060432!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94b877bc17876a71%3A0x42e4b84d0c0fdb16!2sIgreja%20Evang%C3%A9lica%20Avivamento%20Bibl%C3%ADco%20em%20S%C3%A3o%20Carlos!5e0!3m2!1spt-BR!2sbr"></iframe>
            </div>

        </div>
    </section>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <script>

        // CONTADOR
        function atualizarContador() {
            const data = new Date("May 16, 2026 16:00:00").getTime();
            const agora = new Date().getTime();
            const diff = data - agora;
            const dias = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById("dias").innerText = dias > 0 ? dias : 0;
        }
        atualizarContador();
        setInterval(atualizarContador, 60000);

        // QR PIX
        document.getElementById("valorPix").addEventListener("change", function () {
            const chave = "45289314865";
            const valor = this.value;
            if (!valor) return;
            document.getElementById("qrcode").innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: `Pagamento Pix - Ester & Leo - R$${valor} - ${chave}`,
                width: 200,
                height: 200
            });
        });

    </script>

</body>
</html>

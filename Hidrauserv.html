<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCP - AMC Hidráulica</title>

    <style>

        :root {
            --primary-color: #ec3237;
            --secondary-color: #f1f5f9;
            --success: #198754;
            --text-color: #333;
            --border-radius: 8px;
        }

        body {
            font-family: 'Segoe UI',Tahoma,Verdana,sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-container img {
            max-height: 50px;
            background: white;
            padding: 5px;
            border-radius: 4px;
        }

        .container {
            padding: 2rem;
            max-width: 1200px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 2rem;
        }

        .machines-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            gap: 1.5rem;
        }

        .machine-btn {
            background: white;
            border: 2px solid var(--primary-color);
            border-radius: var(--border-radius);
            padding: 2rem;
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            cursor: pointer;
            transition: .3s;
        }

            .machine-btn:hover {
                background: var(--primary-color);
                color: white;
            }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.6);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            width: 95%;
            max-width: 1100px;
            border-radius: var(--border-radius);
            padding: 2rem;
            max-height: 90vh;
            overflow: auto;
            position: relative;
        }

        .close-modal {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 1.5rem;
            border: none;
            background: none;
            cursor: pointer;
        }

        .top-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .form-group label {
            font-weight: 600;
            font-size: .9rem;
            display: block;
            margin-bottom: .4rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: .6rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .panels-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .panel {
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: var(--border-radius);
        }

        .panel-header {
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: 1rem;
        }

        .input-row {
            display: flex;
            gap: .5rem;
            margin-bottom: 1rem;
            align-items: end;
        }

        .btn-add {
            width: 38px;
            height: 38px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 1.4rem;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85rem;
            background: white;
        }

        th, td {
            border: 1px solid #cbd5e1;
            padding: 8px;
        }

        th {
            background: var(--primary-color);
            color: white;
        }

        .submit-btn {
            width: 100%;
            margin-top: 2rem;
            padding: 1rem;
            border: none;
            background: var(--success);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-container">
            <img src="https://amchidraulica.com.br/wp/wp-content/uploads/2025/04/1-2.webp">
        </div>
        <strong>Sistema de PCP</strong>
    </header>

    <div class="container">

        <h1>Controle de Produção</h1>

        <div class="machines-grid">

            <button class="machine-btn" onclick="abrirModal(1)">Máquina 1</button>
            <button class="machine-btn" onclick="abrirModal(2)">Máquina 2</button>
            <button class="machine-btn" onclick="abrirModal(3)">Máquina 3</button>
            <button class="machine-btn" onclick="abrirModal(4)">Máquina 4</button>
            <button class="machine-btn" onclick="abrirModal(5)">Máquina 5</button>
            <button class="machine-btn" onclick="abrirModal(6)">Máquina 6</button>
            <button class="machine-btn" onclick="abrirModal(7)">Máquina 7</button>
            <button class="machine-btn" onclick="abrirModal(8)">Máquina 8</button>

        </div>
    </div>

    <div class="modal-overlay" id="modal">

        <div class="modal-content">

            <button class="close-modal" onclick="fecharModal()">×</button>

            <h2 id="modal-title"></h2>

            <div class="top-fields">

                <div class="form-group">
                    <label>Operador</label>
                    <input id="cod-operador">
                </div>

                <div class="form-group">
                    <label>Data</label>
                    <input type="date" id="data-registro">
                </div>

                <div class="form-group">
                    <label>Turno</label>
                    <select id="turno">
                        <option value="1">1º Turno</option>
                        <option value="2">2º Turno</option>
                        <option value="3">3º Turno</option>
                    </select>
                </div>

            </div>

            <div class="panels-container">

                <div class="panel">

                    <div class="panel-header"><h3>Produção</h3></div>

                    <div class="input-row">

                        <div class="form-group">
                            <label>Peça</label>
                            <select id="prod-peca">
                                <option>Memmo</option>
                                <option>Sugar</option>
                                <option>Espiga</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Qtd</label>
                            <input type="number" id="prod-qtd">
                        </div>

                        <button class="btn-add" onclick="addProducao()">+</button>

                    </div>

                    <table>

                        <thead>
                            <tr>
                                <th>Peça</th>
                                <th>Qtd</th>
                                <th>Hora</th>
                                <th>Lote</th>
                            </tr>
                        </thead>

                        <tbody id="tbody-producao"></tbody>

                    </table>

                </div>

                <div class="panel">

                    <div class="panel-header"><h3>Parada</h3></div>

                    <div class="input-row">

                        <div class="form-group">
                            <label>Motivo</label>
                            <select id="parada-motivo">
                                <option>Troca de Ferramenta</option>
                                <option>Falta de Material</option>
                                <option>Manutenção da Máquina</option>
                                <option>Banheiro</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Início</label>
                            <input type="time" id="parada-inicio">
                        </div>

                        <div class="form-group">
                            <label>Fim</label>
                            <input type="time" id="parada-fim">
                        </div>

                        <button class="btn-add" onclick="addParada()">+</button>

                    </div>

                    <table>

                        <thead>
                            <tr>
                                <th>Motivo</th>
                                <th>Início</th>
                                <th>Fim</th>
                            </tr>
                        </thead>

                        <tbody id="tbody-parada"></tbody>

                    </table>

                </div>

            </div>

            <div class="form-group" style="margin-top:20px">
                <label>Observações</label>
<textarea id="observacoes"></textarea>
            </div>

            <button class="submit-btn" id="btn-enviar" onclick="prepararEnvio()">Enviar Relatório</button>

        </div>
    </div>

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCrdE0G59vmnI23t_1aPJizNXLcZ5MH6Lk",
            authDomain: "chadecozinhaesterleonardo.firebaseapp.com",
            databaseURL: "https://chadecozinhaesterleonardo-default-rtdb.firebaseio.com",
            projectId: "chadecozinhaesterleonardo",
            storageBucket: "chadecozinhaesterleonardo.firebasestorage.app",
            messagingSenderId: "926086485235",
            appId: "1:926086485235:web:923a115e3a430b0fe4d386"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        let maquinaAtual = "";
        let listaProducao = [];
        let listaParada = [];

        document.getElementById("data-registro").value = new Date().toISOString().split("T")[0];

        window.abrirModal = function (num) {

            maquinaAtual = "Maquina_" + num;

            document.getElementById("modal-title").innerText = "Lançamento - Máquina " + num;

            document.getElementById("modal").style.display = "flex";

            listaProducao = [];
            listaParada = [];

            atualizarTabelas();

        }

        window.fecharModal = function () {

            document.getElementById("modal").style.display = "none";

        }

        window.addProducao = function () {

            const peca = document.getElementById("prod-peca").value;
            const qtd = parseInt(document.getElementById("prod-qtd").value);

            if (!qtd) { alert("Digite quantidade"); return; }

            const hora = new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
            const lote = "LT-" + Math.floor(Math.random() * 90000 + 10000);

            listaProducao.push({ peca, quantidade: qtd, horario: hora, lote });

            document.getElementById("prod-qtd").value = "";

            atualizarTabelas();

        }

        window.addParada = function () {

            const motivo = document.getElementById("parada-motivo").value;
            const inicio = document.getElementById("parada-inicio").value;
            const fim = document.getElementById("parada-fim").value;

            if (!inicio || !fim) { alert("Preencha horário"); return; }

            if (fim < inicio) { alert("Fim menor que início"); return; }

            listaParada.push({ motivo, inicio, fim });

            document.getElementById("parada-inicio").value = "";
            document.getElementById("parada-fim").value = "";

            atualizarTabelas();

        }

        window.atualizarTabelas = function () {

            const tbProd = document.getElementById("tbody-producao");
            const tbParada = document.getElementById("tbody-parada");

            tbProd.innerHTML = "";
            tbParada.innerHTML = "";

            listaProducao.forEach(p => {
                tbProd.innerHTML += `<tr><td>${p.peca}</td><td>${p.quantidade}</td><td>${p.horario}</td><td>${p.lote}</td></tr>`;
            });

            listaParada.forEach(p => {
                tbParada.innerHTML += `<tr><td>${p.motivo}</td><td>${p.inicio}</td><td>${p.fim}</td></tr>`;
            });

        }

        window.prepararEnvio = async function () {

            const operador = document.getElementById("cod-operador").value;
            const data = document.getElementById("data-registro").value;
            const turno = document.getElementById("turno").value;
            const obs = document.getElementById("observacoes").value;

            const btn = document.getElementById("btn-enviar");

            if (!operador) { alert("Digite operador"); return; }

            if (listaProducao.length === 0 && listaParada.length === 0) {
                alert("Adicione produção ou parada");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Enviando...";

            try {

                await push(ref(database, `relatorios_pcp/${data}/${maquinaAtual}`), {

                    operador,
                    turno,
                    data,
                    producao: listaProducao,
                    paradas: listaParada,
                    observacoes: obs,
                    timestamp: Date.now()

                });

                alert("Relatório enviado");

                fecharModal();

            } catch (e) {

                console.error(e);
                alert("Erro ao enviar");

            }

            btn.disabled = false;
            btn.innerText = "Enviar Relatório";

        }

    </script>

</body>
</html>
